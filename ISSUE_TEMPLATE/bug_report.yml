name: Bug report
description: Something is not working as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The behavior you saw. Add a screenshot or the error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: prod / staging / local · browser or device
