name: Hata bildirimi
description: Beklendiği gibi çalışmayan bir şey
labels: ["bug"]
body:
  - type: textarea
    id: ne-oldu
    attributes:
      label: Ne oldu
      description: Gördüğünüz davranış. Ekran görüntüsü veya hata mesajı ekleyin.
    validations:
      required: true
  - type: textarea
    id: beklenen
    attributes:
      label: Beklenen
    validations:
      required: true
  - type: textarea
    id: adimlar
    attributes:
      label: Nasıl tekrarlanır
      placeholder: |
        1.
        2.
  - type: input
    id: ortam
    attributes:
      label: Ortam
      placeholder: prod / staging / yerel · tarayıcı veya cihaz
